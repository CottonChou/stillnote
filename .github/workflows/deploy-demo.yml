name: Deploy Demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stillnote-demo-deployment
  cancel-in-progress: false

jobs:
  deploy:
    # This is the maintainer's Demo deployment, not a default self-hosted
    # deployment workflow. Forks and downstream repositories must configure
    # their own deployment pipeline and credentials.
    if: github.repository == 'CottonChou/stillnote'
    name: Build and deploy Demo Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STILLNOTE_WORKER_NAME: ${{ secrets.STILLNOTE_DEMO_WORKER_NAME }}
      STILLNOTE_D1_DATABASE_NAME: ${{ secrets.STILLNOTE_DEMO_D1_DATABASE_NAME }}
      STILLNOTE_D1_DATABASE_ID: ${{ secrets.STILLNOTE_DEMO_D1_DATABASE_ID }}
      STILLNOTE_R2_BUCKET_NAME: ${{ secrets.STILLNOTE_DEMO_R2_BUCKET_NAME }}
      STILLNOTE_R2_PREVIEW_BUCKET_NAME: ${{ secrets.STILLNOTE_DEMO_R2_PREVIEW_BUCKET_NAME }}
      STILLNOTE_AUTH_USERNAME: ${{ secrets.STILLNOTE_DEMO_AUTH_USERNAME }}
      STILLNOTE_SESSION_TTL_DAYS: ${{ secrets.STILLNOTE_DEMO_SESSION_TTL_DAYS }}
      STILLNOTE_DEMO_MODE: "true"
      STILLNOTE_DEMO_RESET_CRON: "0 19 * * *"
      DEMO_DEPLOY_DOMAIN: ${{ secrets.STILLNOTE_DEMO_CUSTOM_DOMAIN }}
      STILLNOTE_DEPLOYMENT_TRIGGER: ${{ github.event_name == 'release' && 'github_release' || 'manual' }}
      STILLNOTE_DEPLOYMENT_METHOD: "github_actions"

    steps:
      - name: Checkout Demo source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            if [[ "$attempt" = "3" ]]; then
              exit 1
            fi
            sleep "$((15 * attempt))"
          done

      - name: Resolve Release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at || '' }}
        run: |
          if [ -z "${RELEASE_PUBLISHED_AT}" ]; then
            RELEASE_PUBLISHED_AT="$(gh api repos/CottonChou/stillnote/releases/latest --jq '.published_at')"
          fi
          echo "STILLNOTE_RELEASED_AT=${RELEASE_PUBLISHED_AT}" >> "${GITHUB_ENV}"

      - name: Deploy Demo Worker
        run: bun run deploy

      - name: Verify Demo URL
        if: env.DEMO_DEPLOY_DOMAIN != ''
        run: curl --fail --silent --show-error --location --max-time 20 "https://${DEMO_DEPLOY_DOMAIN}/"
