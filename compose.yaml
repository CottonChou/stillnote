services:
  stillnote:
    image: "${STILLNOTE_IMAGE:-ghcr.io/cottonchou/stillnote}:${STILLNOTE_VERSION:-latest}"
    restart: unless-stopped
    init: true
    ports:
      - "${STILLNOTE_PORT:-8787}:8787"
    environment:
      STILLNOTE_AUTH_USERNAME: "${STILLNOTE_AUTH_USERNAME:-admin}"
      STILLNOTE_AUTH_PASSWORD: "${STILLNOTE_AUTH_PASSWORD:?Set STILLNOTE_AUTH_PASSWORD before starting StillNote}"
      STILLNOTE_CONTAINER_IMAGE: "${STILLNOTE_IMAGE:-ghcr.io/cottonchou/stillnote}"
    volumes:
      - stillnote-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  stillnote-data:
